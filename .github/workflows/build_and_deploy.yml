name: Build Android APK Release & Deploy Modal

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # =============================================================
  # JOB 1: Build Android APK (Siap Download)
  # =============================================================
  build-apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (v9.3.1)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-disabled: false

      - name: Prepare Keystore & Environment Files
        run: |
          # Generate debug.keystore from base64 if present or create standard debug keystore
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          touch .env
          if [ -f ".env.example" ]; then
            cp .env.example .env
          fi

      - name: Build Android APK
        run: |
          gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PAP-AI-Generator-App
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  # =============================================================
  # JOB 2: Deploy Python Backend ke Modal.com
  # =============================================================
  deploy-modal:
    name: 🚀 Deploy Modal.com Backend (H100 DiT)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Modal CLI & Dependencies
        run: |
          pip install modal fastapi pydantic uvicorn

      - name: Authenticate & Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          TOKEN_ID="${MODAL_TOKEN_ID:-ak-hdnamdluuWZBMYTB2rLghU}"
          TOKEN_SECRET="${MODAL_TOKEN_SECRET:-as-BvBUZx69tj3wSgpji9iM2b}"
          echo "Configuring Modal token..."
          modal token set --token-id "$TOKEN_ID" --token-secret "$TOKEN_SECRET"
          echo "Deploying HunyuanVideo DiT backend..."
          modal deploy backend/app.py

